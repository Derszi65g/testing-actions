name: Cloud Worker

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: run
        type: choice
        options:
          - run
          - dry-run

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get -qq update > /dev/null 2>&1
          sudo apt-get -qq install -y unrar p7zip-full curl unzip > /dev/null 2>&1
          curl -fsSL https://downloads.rclone.org/rclone-current-linux-amd64.zip -o /tmp/rclone.zip
          sudo unzip -q -j -o /tmp/rclone.zip "*/rclone" -d /usr/local/bin
          sudo chmod +x /usr/local/bin/rclone
          rm -f /tmp/rclone.zip
          pip -q install huggingface_hub > /dev/null 2>&1
          echo "[OK] Dependencies ready ($(rclone version | head -n 1))"

      - name: Execute worker
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RCLONE_KEY_B64: ${{ secrets.RCLONE_KEY_B64 }}
          TASK_CONFIG_REMOTE: ${{ secrets.TASK_CONFIG_REMOTE }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ARCHIVE_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
          QUIET_LOGS: "1"
        run: |
          if [ "${{ github.event.inputs.mode }}" = "dry-run" ]; then
            python3 scripts/run_worker.py --dry-run
          else
            python3 scripts/run_worker.py
          fi
          echo "[OK] Worker completed"
